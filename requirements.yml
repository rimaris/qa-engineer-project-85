---
functional:
  - Авторизация через GitHub.
  - Регистрация и вход по email и паролю.
  - Восстановление пароля по email.
  - Регистрация и авторизация через Discord.
  - Гостевой режим: возможность сыграть «простую битву» без регистрации.
  - Создание игры и участие в матчах против бота или другого игрока.
  - Выбор уровня сложности задачи.
  - Установка времени на решение задачи.
  - Выбор задачи по тегу или названию.
  - Участие в турнирах (индивидуальных и командных) и создание собственных.
  - Выбор языка программирования из поддерживаемого списка во время игры.
  - Доступ к страницам и управлению турнирами только для авторизованных пользователей.
  - Просмотр таблицы лидеров за выбранный период (неделя, месяц, всё время).
  - Просмотр истории игр.
  - Выбор языка задачи (русский/английский) на вкладке «Task».
  - Возможность сдаться, сбросить код и запустить проверку решения в терминале.
  - Выбор темы редактора/терминала (тёмная/светлая).
  - Общение пользователей в чате игры.
non-functional:
  - Обновления в реальном времени: состояние матча синхронизируется с минимальной задержкой.
  - Масштабируемость: система выдерживает одновременную активность большого числа игр и пользователей.
  - Безопасность: защита персональных данных и учётных записей (HTTPS, хеширование паролей, OAuth).
  - Мультиязычность: поддержка русского и английского языков для интерфейса и формулировок задач.
implicit:
  - Полный функционал (турниры и др.) доступен только авторизованным пользователям; гостевой режим — для ознакомления.
  - Победитель определяется корректностью решения и временем его получения при равных условиях (одна и та же задача).
  - Игрок не может редактировать код в редакторе соперника.
