---
- summary: |
    Регистрация по email и паролю (позитивный сценарий)
  requirement: |
    Пользователь может зарегистрироваться по email, установить пароль и войти в систему.
  prerequisites: |
    Открыта страница регистрации.
  test-data: |
    Nickname: new_user123
    Email: deseyap104@aravites.com
    Пароль: Password123!
  steps:
    - Ввести nickname
    - Ввести email
    - Ввести пароль
    - Ввести подтверждение пароля
    - Нажать кнопку «Submit»
  expected-result: |
    Пользователь успешно зарегистрирован и попадает на главную страницу.

- summary: |
    Вход по email и паролю (валидные данные)
  requirement: |
    При верном вводе email и пароля пользователь входит в систему и попадает на главную страницу.
  prerequisites: |
    Открыта страница логина.
    Существует активный пользователь с подтверждённым email.
  test-data: |
    Email: deseyap104@aravites.com
    Пароль: Password123!
  steps:
    - Ввести email
    - Ввести пароль
    - Нажать кнопку «Submit»
  expected-result: |
    Происходит авторизация и отображается главная страница с профилем пользователя.

- summary: |
    Авторизация через GitHub 
  requirement: |
    Пользователь может авторизоваться через аккаунт GitHub.
  prerequisites: |
    Открыта страница логина. У пользователя есть аккаунт GitHub.
  test-data: |
    Аккаунт GitHub: test-github-user
  steps:
    - Нажать «Sign in with GitHub»
    - Разрешить доступ приложению (если запрашивается)
  expected-result: |
    Пользователь авторизован и попадает на главную страницу.

- summary: |
    Авторизация через Discord
  requirement: |
    Пользователь может авторизоваться через аккаунт Discord.
  prerequisites: |
    Открыта страница логина. У пользователя есть аккаунт Discord.
  test-data: |
    Аккаунт Discord: test-discord-user
  steps:
    - Нажать «Sign in with Discord»
    - Разрешить доступ приложению (если запрашивается)
  expected-result: |
    Пользователь авторизован и попадает на главную страницу.

- summary: |
    Восстановление пароля по email
  requirement: |
    Пользователь может запросить восстановление пароля и установить новый пароль через ссылку из письма.
  prerequisites: |
    Открыта страница «Forgot password».
    Имеется учётная запись с подтверждённым email.
  test-data: |
    Email: deseyap104@aravites.com
  steps:
    - Ввести email в форму восстановления
    - Отправить запрос
    - Перейти по ссылке в письме
    - Указать новый пароль и подтвердить
  expected-result: |
    Пароль успешно изменён. Вход по новому паролю успешен.

- summary: |
    Гостевой режим — запуск «простой битвы» без регистрации
  requirement: |
    Неавторизованный пользователь может запустить демо-игру (простую битву).
  prerequisites: |
    Открыта главная страница.
  test-data: |
    —
  steps:
    - Нажать «Try simple battle»
  expected-result: |
    Открывается редактор кода с простой задачей и тестами; игра доступна без регистрации.

- summary: |
    Создание матча против бота с выбором сложности и контроля времени
  requirement: |
    Пользователь может создать игру против бота, выбрав уровень сложности и время на решение.
  prerequisites: |
    Пользователь авторизован, открыта страница создания игры.
  test-data: |
    Difficulty: Medium
    Time control: 15 min
  steps:
    - Выбрать режим «With a bot»
    - Установить сложность и время
    - Нажать «Fight»
  expected-result: |
    Игра создана и запущена; в заголовке/панели отображаются выбранные параметры, соперник — бот.

- summary: |
    Создание матча со случайным соперником
  requirement: |
    Пользователь может создать публичную игру и получить соперника из очереди ожидания.
  prerequisites: |
    Пользователь авторизован.
  test-data: |
    Difficulty: Any
  steps:
    - Выбрать режим «With other user»
    - Нажать «Fight» и дождаться подключения соперника
  expected-result: |
    Игра стартует при подключении второго игрока; оба видят редакторы и один и тот же набор тестов.

- summary: |
    Выбор задачи по тегу
  requirement: |
    Пользователь может отфильтровать или найти задачу по тегу при создании игры.
  prerequisites: |
    Открыта форма создания игры.
  test-data: |
    Тег: strings
  steps:
    - Открыть список задач
    - Выбрать тег «strings»
    - Выбрать подходящую задачу
  expected-result: |
    В поле задачи отображается выбранная задача; фильтрация работает корректно.

- summary: |
    Смена языка программирования во время игры
  requirement: |
    Игрок может менять язык программирования; среда правильно запускает тесты для выбранного языка.
  prerequisites: |
    Идёт активная игра.
  test-data: |
    —
  steps:
    - Открыть список языков
    - Переключить язык на Python
    - Запустить тесты
  expected-result: |
    Тесты выполняются для нового языка; результат отображается корректно.

- summary: |
    Запуск тестов — успешное прохождение
  requirement: |
    При корректном решении все тесты проходят; пользователь получает уведомление об успехе.
  prerequisites: |
    Идёт активная игра; в редакторе корректное решение.
  test-data: |
    Решение, которое проходит все тесты.
  steps:
    - Нажать «Run»
  expected-result: |
    Все тесты пройдены; отображается сообщение об успешном прохождении.

- summary: |
    Запуск тестов — неуспешное прохождение
  requirement: |
    При ошибочном решении тесты должны падать, а система — показывать вывод с ошибками.
  prerequisites: |
    Идёт активная игра; в редакторе заведомо неверное решение.
  test-data: |
    Решение с ошибкой.
  steps:
    - Нажать «Run»
  expected-result: |
    Видно сообщение об ошибке/проваленных тестах; указаны номера кейсов и ожидаемые/фактические значения.

- summary: |
    Кнопка «Сдаться» завершает игру с поражением
  requirement: |
    Игрок может сдаться; после подтверждения матч завершается и фиксируется поражение.
  prerequisites: |
    Идёт активная игра.
  test-data: |
    —
  steps:
    - Нажать «Give up»
    - Подтвердить действие
  expected-result: |
    Игра завершается, статус — поражение; результат отражается в истории игр.

- summary: |
    Сброс кода к исходному шаблону
  requirement: |
    Игрок может сбросить код в редакторе до исходного состояния.
  prerequisites: |
    Идёт активная игра; код изменён.
  test-data: |
    —
  steps:
    - Нажать «Reset solution»
  expected-result: |
    Код возвращается к исходному шаблону для выбранного языка.

- summary: |
    Переключение темы терминала (тёмная/светлая)
  requirement: |
    Игрок может менять тему оформления терминала.
  prerequisites: |
    Открыта игра или редактор.
  test-data: |
    -
  steps:
    - Нажать иконку темы в терминале
  expected-result: |
    Тема интерфейса меняется сразу, без перезагрузки страницы.

- summary: |
    Игровой чат — отправка и получение сообщений
  requirement: |
    Пользователи могут обмениваться сообщениями в чате игры в реальном времени.
  prerequisites: |
    Идёт активная игра с двумя участниками.
  test-data: |
    Сообщение: «Удачи!»
  steps:
    - Ввести сообщение в поле чата
    - Отправить сообщение
  expected-result: |
    Сообщение появляется у обоих игроков почти мгновенно и сохраняется в истории чата матча.

- summary: |
    Просмотр таблицы лидеров
  requirement: |
    Пользователь может просматривать рейтинги за разные периоды.
  prerequisites: |
    Пользователь авторизован; открыта страница рейтинга.
  test-data: |
    —
  steps:
    - Переключить период на «Week»
    - Переключить период на «Month»
    - Переключить период на «All»
  expected-result: |
    Список лидеров корректно обновляется для каждого периода.

- summary: |
    Нельзя редактировать код в редакторе соперника
  requirement: |
    Игрок не имеет прав на изменение редактора кода другого игрока.
  prerequisites: |
    Идёт матч между двумя игроками.
  test-data: |
    —
  steps:
    - Попытаться ввести текст в область редактора соперника
  expected-result: |
    Изменения не применяются; область соперника недоступна для редактирования.

- summary: |
    Вход по email и паролю (неверный пароль)
  requirement: |
    При неверном пароле система не должна авторизовать пользователя и должна показать сообщение об ошибке.
  prerequisites: |
    Открыта страница логина.
    Существует активный пользователь.
  test-data: |
    Email: deseyap104@aravites.com
    Пароль: WrongPassword
  steps:
    - Ввести email
    - Ввести неверный пароль
    - Нажать «Submit»
  expected-result: |
    Авторизация не происходит; появляется уведомление об ошибке.

- summary: |
    Регистрация по email — повторное использование существующего email
  requirement: |
    Система должна предотвращать регистрацию на уже занятый email и сообщать об ошибке.
  prerequisites: |
    Существует учётная запись с email deseyap104@aravites.com.
  test-data: |
    Email: deseyap104@aravites.com
    Пароль: Password123!
  steps:
    - Открыть страницу регистрации
    - Ввести существующий email и любой пароль
    - Подтвердить форму
  expected-result: |
    Регистрация отклонена; показано сообщение о том, что email уже используется.

- summary: |
    Просмотр истории игр
  requirement: |
    Пользователь может просматривать историю завершённых игр.
  prerequisites: |
    Пользователь авторизован; открыта главная страница лобби.
  test-data: |
    —
  steps:
    - Нажать кнопку «History»
  expected-result: |
    Отображается история игр пользователя с возможностью открыть запись конкретного матча.
​
